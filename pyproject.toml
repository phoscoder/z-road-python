[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zroad-client"
version = "0.1.0"
description = "Python client for a Z-Road security server's internal API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []          # standard library only

[project.optional-dependencies]
verify = ["cryptography>=42"]   # offline proof verification

[tool.setuptools.packages.find]
where = ["src"]
